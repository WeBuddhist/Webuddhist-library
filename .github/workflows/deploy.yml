name: Deploy to EC2

# Three environments:
#   push to dev            -> dev
#   push (merge) to main   -> testing
#   tag vX.Y.Z on main     -> prod
on:
  push:
    branches:
      - dev
      - main
    tags:
      - "v*"
  workflow_dispatch:

env:
  TARGET_ENV: ${{ startsWith(github.ref, 'refs/tags/v') && 'prod' || (github.ref_name == 'main' && 'testing' || 'dev') }}

concurrency:
  # One deploy at a time per environment, so two tags (or two merges) never race.
  group: deploy-${{ startsWith(github.ref, 'refs/tags/v') && 'prod' || (github.ref_name == 'main' && 'testing' || 'dev') }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements_dev.txt

      - name: Run tests
        run: |
          python -m pytest tests/ -v

  deploy:
    needs: test
    runs-on: ubuntu-latest
    environment: ${{ startsWith(github.ref, 'refs/tags/v') && 'prod' || (github.ref_name == 'main' && 'testing' || 'dev') }}
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          # Release tags check their ancestry against main.
          fetch-depth: ${{ startsWith(github.ref, 'refs/tags/') && 0 || 1 }}

      - name: Check the release tag
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          if ! [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Release tags must look like v1.2.3; got $GITHUB_REF_NAME"
            exit 1
          fi
          # Prod only gets commits that went through main (and so through testing).
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::$GITHUB_REF_NAME ($GITHUB_SHA) is not on main"
            exit 1
          fi

      - name: Release version
        id: version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "app_version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "app_version=${GITHUB_REF_NAME//\//-}-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          fi
          echo "Deploying $GITHUB_REF_NAME ($GITHUB_SHA) to $TARGET_ENV"

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_ROLE }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Create Deployment Script
        run: |
          cat << 'EOF' > deploy_script.sh
          #!/bin/bash
          set -euo pipefail
          cd ${{ vars.APP_DIR || '/opt/openpecha-backend' }}

          DEPLOY_SHA=${{ github.sha }}
          git -c safe.directory="$PWD" fetch origin "$DEPLOY_SHA"
          git -c safe.directory="$PWD" diff --quiet
          git -c safe.directory="$PWD" diff --cached --quiet
          git -c safe.directory="$PWD" checkout --detach "$DEPLOY_SHA"

          umask 077
          cat << 'ENV_EOF' > .env
          NEO4J_URI=${{ vars.NEO4J_URI }}
          NEO4J_DATABASE=${{ vars.NEO4J_DATABASE || 'neo4j' }}
          NEO4J_USERNAME=${{ vars.NEO4J_USERNAME }}
          NEO4J_PASSWORD=${{ secrets.NEO4J_PASSWORD }}
          AWS_REGION=${{ vars.AWS_REGION }}
          AWS_S3_BUCKET=${{ vars.AWS_S3_BUCKET }}
          OPENSEARCH_ENDPOINT=${{ vars.OPENSEARCH_ENDPOINT }}
          OPENSEARCH_INDEX=${{ vars.OPENSEARCH_INDEX || 'content-search' }}
          OPENSEARCH_CATALOG_INDEX=${{ vars.OPENSEARCH_CATALOG_INDEX || 'catalog-search' }}
          OPENSEARCH_AUTH_MODE=${{ vars.OPENSEARCH_AUTH_MODE || 'aws' }}
          OPENSEARCH_USERNAME=${{ vars.OPENSEARCH_USERNAME }}
          OPENSEARCH_PASSWORD=${{ secrets.OPENSEARCH_PASSWORD }}
          ENVIRONMENT=${{ vars.ENVIRONMENT }}
          APP_VERSION=${{ steps.version.outputs.app_version }}
          ROOT_PATH=${{ vars.ROOT_PATH }}
          OTEL_ENABLED=${{ vars.OTEL_ENABLED || 'false' }}
          OTEL_SERVICE_NAME=${{ vars.OTEL_SERVICE_NAME || 'openpecha-api' }}
          OTEL_RESOURCE_ATTRIBUTES=deployment.environment=${{ vars.ENVIRONMENT }}
          OTEL_EXPORTER_OTLP_ENDPOINT=${{ vars.OTEL_EXPORTER_OTLP_ENDPOINT }}
          OTEL_EXPORTER_OTLP_HEADERS=${{ secrets.OTEL_EXPORTER_OTLP_HEADERS }}
          ENV_EOF
          chmod 600 .env

          source .venv/bin/activate
          pip install -r requirements.txt
          python -m scripts.install_neo4j_schema
          owner=$(stat -c '%U:%G' .)
          chown -R "$owner" .
          sudo systemctl restart ${{ vars.SERVICE_NAME || 'openpecha-api' }}
          if ! curl --fail --retry 10 --retry-delay 2 --retry-all-errors http://127.0.0.1:8000/__/health; then
            sudo journalctl -u ${{ vars.SERVICE_NAME || 'openpecha-api' }} -n 100 --no-pager
            exit 1
          fi
          EOF

      - name: Execute via SSM
        run: |
          source scripts/ssm.sh
          ssm_run "${{ vars.EC2_INSTANCE_ID }}" deploy_script.sh
